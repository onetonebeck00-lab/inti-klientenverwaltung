# Lokale Datenbank für die Entwicklung. Nicht für den Echtbetrieb gedacht.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: inti
      POSTGRES_PASSWORD: inti
      POSTGRES_DB: inti
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - inti-db:/var/lib/postgresql/data
volumes:
  inti-db:
